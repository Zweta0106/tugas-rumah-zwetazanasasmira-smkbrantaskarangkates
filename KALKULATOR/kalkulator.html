<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Nilai</title>
    <link rel="stylesheet" href="kalkulator.css">
    <script src="style.js" defer></script>
</head>

<body>

    <div class="container">
        <div class="header">
            <span class="icon">✦</span>
            <h2>Kalkulator Nilai</h2>
            <p>Hitung rata-rata dan predikat nilaimu dengan mudah.</p>
        </div>

        <div class="form">
            <label>Nilai Tugas</label>
            <input type="number" id="tugas" placeholder="Masukkan nilai tugas">

            <label>Nilai UTS</label>
            <input type="number" id="uts" placeholder="Masukkan nilai UTS">

            <label>Nilai UAS</label>
            <input type="number" id="uas" placeholder="Masukkan nilai UAS">

            <button onclick="hitungNilai()">Hitung Nilai</button>
        </div>

        <div class="result">
            <h3>Hasil Perhitungan</h3>
            <p id="hasil">Hasil nilai akan muncul di sini.</p>
        </div>

        <footer>
            <p>© 2026 | Kalkulator Nilai Siswa</p>
        </footer>
    </div>

</body>

</html>
